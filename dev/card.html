<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target Notebook test card</title>
<body style="font:15px/1.45 'Helvetica Neue',Helvetica,Arial,sans-serif;margin:0;padding:16px;background:#e9edf3;color:#16202e">
<h1 style="font-size:19px;margin:0 0 6px">Test card: <span id="name"></span></h1>
<p style="margin:0 0 12px;color:#5d6b7e">A computer-drawn shot card for trying the scanner. Save the picture to your photos (press and hold it on a
phone) and pick it with "Choose photo", or photograph it off a screen. Add <code>?type=2510BM</code> for a 10-bull card.</p>
<img id="card" alt="Test shot card" style="display:block;width:100%;max-width:1100px;border-radius:12px">
<p><a id="save" download style="display:inline-block;padding:12px 18px;border-radius:12px;background:#1a5fd0;color:#fff;font-weight:600;text-decoration:none">Download image</a></p>
<h2 style="font-size:15px;margin:18px 0 6px">What the app should find</h2>
<table id="expect" style="border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden"></table>
<p id="total" style="font-weight:700"></p>
<script type="module">
import { CARDS, scoreShot, DEFAULT_SETTINGS } from '../js/model.js';
import { drawCard } from './synth.js';

const type = new URLSearchParams(location.search).get('type') ?? '2505CS';
const card = CARDS[type] ?? CARDS['2505CS'];
// Shots in mm from each diagram's centre (x right, y up), grouped by diagram.
const shots = card.shotsPerDiagram === 2
  ? [
      { x: -6.5, y: 2.5 }, { x: 5.5, y: -3 },      // two separate holes
      { x: -2.2, y: 0.8 }, { x: 1.9, y: -0.6 },    // overlapping pair
      { x: 0.6, y: 0.4 }, { x: 0.6, y: 0.4 },      // both through one hole
      { x: -9, y: -4 }, { x: -3.6, y: -4.4 },      // just touching
      { x: 2, y: 1 }, { x: -19, y: 13 },           // a good one and a wide one
    ]
  : [
      { x: 0.4, y: -0.3 }, { x: 3.1, y: 2.2 }, { x: -2.5, y: 1 }, { x: 0.5, y: 3.9 }, { x: 4.3, y: 0.2 },
      { x: -1, y: -1.5 }, { x: 2, y: -2.4 }, { x: -1.2, y: -2.9 }, { x: 7, y: 4 }, { x: 1.2, y: -0.1 },
    ];

const canvas = drawCard(card, shots, { pxPerMm: 8, rotate: 1.5, noise: 4 });
const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.92));
const url = URL.createObjectURL(blob);
document.getElementById('card').src = url;
const save = document.getElementById('save');
save.href = url;
save.download = `test-card-${card.id}.jpg`;
document.getElementById('name').textContent = `${card.label} (${card.gauging} gauging)`;

const per = card.shotsPerDiagram;
const cell = 'style="padding:7px 12px;border-bottom:1px solid #d3dae4;text-align:left"';
let total = 0;
const rows = card.diagrams.map((_, d) => {
  const scores = shots.slice(d * per, d * per + per).map((s) => scoreShot(s.x, s.y, card, DEFAULT_SETTINGS));
  total += scores.reduce((a, b) => a + b, 0);
  const spots = shots.slice(d * per, d * per + per).map((s) => `(${s.x}, ${s.y})`).join(' and ');
  return `<tr><td ${cell}>Diagram ${d + 1}</td><td ${cell}><b>${scores.join(' + ')}</b></td><td ${cell}>${spots} mm</td></tr>`;
});
document.getElementById('expect').innerHTML =
  `<tr><th ${cell}>Position</th><th ${cell}>Score</th><th ${cell}>Shot centres</th></tr>${rows.join('')}`;
document.getElementById('total').textContent = `Total: ${total} / 100. Diagrams are numbered left to right, top row first.`;
</script>
</body>
</html>
